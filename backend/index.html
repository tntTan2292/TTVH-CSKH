<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VNPOST HUE - EXECUTIVE COMMAND CENTER V3.3</title>
    <!-- LIBRARIES -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/recharts@2.10.3/umd/Recharts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/antd@5.12.2/dist/antd.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5.12.2/dist/reset.css">
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.5/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #003a8c; --primary-dark: #002766; --accent: #fadb14; --danger: #ef4444; 
            --bg: #f8fafc; --card-bg: #ffffff; --text-main: #1e293b;
            --text-sub: #64748b; --border: #e2e8f0;
        }
        body { margin: 0; font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text-main); }
        .header { background: #ffffff; padding: 12px 24px; border-bottom: 2px solid var(--primary); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .main-container { padding: 24px; max-width: 1920px; margin: 0 auto; }
        .executive-card { background: var(--card-bg); border-radius: 12px; padding: 0; border: 1px solid var(--border); height: 100%; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); overflow: hidden; }
        .card-inner { padding: 20px; }
        .kpi-value { font-size: 32px; font-weight: 700; color: var(--primary); line-height: 1.1; }
        .kpi-label { font-size: 10px; text-transform: uppercase; color: var(--text-sub); letter-spacing: 1px; margin-bottom: 6px; font-weight: 600; }
        .kpi-sub { font-size: 13px; font-weight: 600; margin-top: 4px; }
        .ant-table-thead > tr > th { background: var(--primary-dark) !important; color: #ffffff !important; font-size: 10px !important; text-transform: uppercase; }
        .section-header { display: flex; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--border); background: #fafafa; }
        .section-indicator { width: 4px; height: 18px; background: var(--primary); border-radius: 2px; margin-right: 12px; }
        .section-title { font-size: 12px; font-weight: 700; color: var(--text-main); text-transform: uppercase; margin: 0; }
        .nav-brand { font-size: 18px; font-weight: 800; color: var(--primary); }
        .report-preview { background: #f1f5f9; padding: 24px; border-radius: 8px; font-family: 'Courier New', Courier, monospace; white-space: pre-wrap; max-height: 500px; overflow-y: auto; border: 1px solid var(--border); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { Layout, Row, Col, Table, Tag, Progress, Button, message, Space, Typography, Badge, Result, Statistic, Modal, Card } = window.antd;
        const { Text, Title } = Typography;
        const { AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Line, LineChart, Legend } = window.Recharts;
        
        const getPerformanceColor = (rate) => {
            if (rate >= 90) return '#059669';
            if (rate >= 75) return '#003a8c';
            if (rate >= 60) return '#f59e0b';
            return '#ef4444';
        };

        const App = () => {
            const [data, setData] = useState(null);
            const [bcvhData, setBcvhData] = useState([]);
            const [slaRisk, setSlaRisk] = useState([]);
            const [provinceData, setProvinceData] = useState([]);
            const [trendData, setTrendData] = useState([]);
            const [trendKpis, setTrendKpis] = useState({});
            const [loading, setLoading] = useState(true);
            const [reportModal, setReportModal] = useState(false);
            const [reportContent, setReportContent] = useState("");
            const API_BASE = "http://localhost:8010";

            const fetchAll = async () => {
                setLoading(true);
                try {
                    const [s, b, r, p, t] = await Promise.all([
                        fetch(`${API_BASE}/api/dashboard/stats`).then(res => res.json()),
                        fetch(`${API_BASE}/api/dashboard/bcvh-summary`).then(res => res.json()),
                        fetch(`${API_BASE}/api/dashboard/sla-risk`).then(res => res.json()),
                        fetch(`${API_BASE}/api/dashboard/province-performance`).then(res => res.json()),
                        fetch(`${API_BASE}/api/dashboard/acceptance-trend`).then(res => res.json())
                    ]);
                    setData(s && !s.error ? s : null);
                    setBcvhData(Array.isArray(b) ? b : []);
                    setSlaRisk(Array.isArray(r) ? r : []);
                    setProvinceData(Array.isArray(p) ? p : []);
                    setTrendData(t.data || []);
                    setTrendKpis(t.kpis || {});
                } catch (err) { message.error("API Error 8010"); } 
                finally { setLoading(false); }
            };

            useEffect(() => { fetchAll(); }, []);

            const handleUpload = async () => {
                const input = document.createElement('input');
                input.type = 'file'; input.accept = '.xlsx';
                input.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const formData = new FormData(); formData.append('file', file);
                    const hide = message.loading('Đang xử lý dữ liệu Flow Intelligence...', 0);
                    try {
                        const res = await fetch(`${API_BASE}/upload`, { method: 'POST', body: formData });
                        if (res.ok) { message.success("Sync Success!"); fetchAll(); }
                        else message.error("Import Failure");
                    } catch (err) { message.error("Network Error"); }
                    finally { hide(); }
                };
                input.click();
            };

            const generateReport = async () => {
                const hide = message.loading('Đang soạn báo cáo điều hành...', 0);
                try {
                    const res = await fetch(`${API_BASE}/api/dashboard/generate-report`);
                    const json = await res.json();
                    if (json.report) { setReportContent(json.report); setReportModal(true); } 
                    else message.error("Lỗi soạn báo cáo");
                } catch (err) { message.error("Lỗi kết nối"); }
                finally { hide(); }
            };

            if (loading && !data) return <div style={{padding: 100, textAlign: 'center'}}><Progress percent={100} status="active" showInfo={false} strokeColor="#003a8c" /></div>;
            if (!data) return <div style={{padding: 100, textAlign: 'center'}}><Result status="info" title="Hệ thống V3.3" extra={<Button type="primary" onClick={handleUpload}>IMPORT DATA</Button>} /></div>;

            const nRate = data.directions.north.total > 0 ? Math.round(data.directions.north.success * 100 / data.directions.north.total) : 0;
            const sRate = data.directions.south.total > 0 ? Math.round(data.directions.south.success * 100 / data.directions.south.total) : 0;
            const iRate = data.directions.intra.total > 0 ? Math.round(data.directions.intra.success * 100 / data.directions.intra.total) : 0;
            const totalSuccessRate = data.kpis.total > 0 ? Math.round(data.kpis.success * 100 / data.kpis.total) : 0;

            return (
                <Layout style={{minHeight: '100vh', background: '#f8fafc'}}>
                    <div className="header">
                        <div className="nav-brand">VNPOST HUẾ <span style={{color: '#f97316'}}>D.O.C</span></div>
                        <Space>
                            <Button icon={<span>📄</span>} onClick={generateReport}>SOẠN BÁO CÁO</Button>
                            <Button type="primary" onClick={handleUpload} style={{background: '#003a8c'}}>NHẬP DỮ LIỆU</Button> 
                            <Button icon={<span>🔄</span>} onClick={fetchAll} />
                        </Space>
                    </div>

                    <div className="main-container">
                        <Row gutter={[20, 20]}>
                            {/* KPI TOP BAR */}
                            <Col span={6}><div className="executive-card" style={{borderTop: '4px solid #003a8c'}}><div className="card-inner"><div className="kpi-label">Tổng sản lượng VIP</div><div className="kpi-value">{(data.kpis.total).toLocaleString()}</div></div></div></Col>
                            <Col span={6}><div className="executive-card" style={{borderTop: '4px solid #059669'}}><div className="card-inner"><div className="kpi-label">Phát thành công</div><div className="kpi-value" style={{color: '#059669'}}>{(data.kpis.success).toLocaleString()}</div><div className="kpi-sub" style={{color: '#059669'}}>Tỷ lệ: {totalSuccessRate}%</div></div></div></Col>
                            <Col span={6}><div className="executive-card" style={{borderTop: '4px solid #f59e0b'}}><div className="card-inner"><div className="kpi-label">Đang tồn đọng</div><div className="kpi-value" style={{color: '#f59e0b'}}>{(data.kpis.pending).toLocaleString()}</div></div></div></Col>
                            <Col span={6}><div className="executive-card" style={{borderTop: '4px solid #ef4444'}}><div className="card-inner"><div className="kpi-label">Vi phạm SLA</div><div className="kpi-value" style={{color: '#ef4444'}}>{(data.kpis.sla).toLocaleString()}</div></div></div></Col>

                            {/* FLOW INTELLIGENCE SECTION */}
                            <Col span={24}>
                                <div className="executive-card">
                                    <div className="section-header"><div className="section-indicator" style={{background: '#003a8c'}}></div><div className="section-title">Radar Dòng chảy Sản lượng (Flow Intelligence)</div></div>
                                    <div className="card-inner">
                                        <Row gutter={24}>
                                            <Col span={18}>
                                                <div style={{height: 350, width: '100%'}}>
                                                    <ResponsiveContainer>
                                                        <AreaChart data={trendData} margin={{top: 10, right: 30, left: 0, bottom: 0}}>
                                                            <defs>
                                                                <linearGradient id="colorNorth" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#1890ff" stopOpacity={0.1}/><stop offset="95%" stopColor="#1890ff" stopOpacity={0}/></linearGradient>
                                                                <linearGradient id="colorSouth" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#f97316" stopOpacity={0.1}/><stop offset="95%" stopColor="#f97316" stopOpacity={0}/></linearGradient>
                                                                <linearGradient id="colorIntra" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#722ed1" stopOpacity={0.1}/><stop offset="95%" stopColor="#722ed1" stopOpacity={0}/></linearGradient>
                                                            </defs>
                                                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                                            <XAxis dataKey="date" axisLine={false} tickLine={false} tick={{fontSize: 10, fill: '#64748b'}} />
                                                            <YAxis axisLine={false} tickLine={false} tick={{fontSize: 10, fill: '#64748b'}} />
                                                            <Tooltip contentStyle={{borderRadius: 8, border: 'none', boxShadow: '0 10px 15px -3px rgba(0,0,0,0.1)'}} />
                                                            <Legend verticalAlign="top" height={36}/>
                                                            <Area name="Hướng Bắc" type="monotone" dataKey="north" stackId="1" stroke="#1890ff" fillOpacity={1} fill="url(#colorNorth)" />
                                                            <Area name="Hướng Nam" type="monotone" dataKey="south" stackId="1" stroke="#f97316" fillOpacity={1} fill="url(#colorSouth)" />
                                                            <Area name="Nội tỉnh (Huế)" type="monotone" dataKey="intra" stackId="1" stroke="#722ed1" fillOpacity={1} fill="url(#colorIntra)" />
                                                            <Line name="TỔNG CHẤP NHẬN" type="monotone" dataKey="total" stroke="#1e293b" strokeWidth={3} dot={{r: 4, fill: '#1e293b'}} />
                                                            <Line name="PHÁT THÀNH CÔNG" type="monotone" dataKey="success" stroke="#059669" strokeWidth={3} strokeDasharray="5 5" />
                                                        </AreaChart>
                                                    </ResponsiveContainer>
                                                </div>
                                            </Col>
                                            <Col span={6}>
                                                <Space direction="vertical" style={{width: '100%'}} size="large">
                                                    <div><div className="kpi-label">Ngày cao điểm (Peak Day)</div><div className="kpi-value" style={{fontSize: 24}}>{trendKpis.peak_day || 'N/A'}</div><Text type="secondary" style={{fontSize: 12}}>Sản lượng: {trendKpis.peak_value} đơn</Text></div>
                                                    <div><div className="kpi-label">Xu hướng tăng trưởng</div><div className="kpi-value" style={{fontSize: 24, color: trendKpis.growth_rate >= 0 ? '#059669' : '#ef4444'}}>{trendKpis.growth_rate}%</div><Text type="secondary" style={{fontSize: 12}}>So với ngày trước đó</Text></div>
                                                    <div><div className="kpi-label">Sản lượng trung bình</div><div className="kpi-value" style={{fontSize: 24}}>{trendKpis.avg_volume}</div><Text type="secondary" style={{fontSize: 12}}>đơn/ngày</Text></div>
                                                </Space>
                                            </Col>
                                        </Row>
                                    </div>
                                </div>
                            </Col>

                            {/* DIRECTIONAL CARDS */}
                            <Col span={8}><Card className="executive-card"><Statistic title="Hướng Bắc" value={data.directions.north.total} /><Progress percent={nRate} strokeColor={getPerformanceColor(nRate)} /></Card></Col>
                            <Col span={8}><Card className="executive-card"><Statistic title="Nội tỉnh (Huế)" value={data.directions.intra.total} valueStyle={{color: '#722ed1'}} /><Progress percent={iRate} strokeColor="#722ed1" /></Card></Col>
                            <Col span={8}><Card className="executive-card"><Statistic title="Hướng Nam" value={data.directions.south.total} /><Progress percent={sRate} strokeColor={getPerformanceColor(sRate)} /></Card></Col>

                            {/* TABLES SECTION */}
                            <Col span={24}>
                                <div className="executive-card">
                                    <div className="section-header"><div className="section-indicator"></div><div className="section-title">Ma trận Hiệu suất Tỉnh phát</div></div>
                                    <div className="card-inner">
                                        <Table dataSource={provinceData} columns={[
                                            { title: 'PHÂN LOẠI', dataIndex: 'direction', render: v => <Tag color={v === 'Bắc' ? 'blue' : v === 'Nội tỉnh' ? 'purple' : 'orange'}>{v}</Tag> },
                                            { title: 'TỈNH PHÁT', dataIndex: 'name', render: t => <Text strong>{t}</Text> },
                                            { title: 'SẢN LƯỢNG', dataIndex: 'total', align: 'right' },
                                            { title: 'THÀNH CÔNG (%)', dataIndex: 'success_rate', render: v => <div style={{display: 'flex', alignItems: 'center', gap: 12}}><Progress percent={v} size="small" showInfo={false} strokeColor={getPerformanceColor(v)} style={{flex: 1}} /><Text strong style={{fontSize: 11}}>{v}%</Text></div> },
                                            { title: 'RỦI RO SLA (%)', dataIndex: 'sla_rate', render: v => <div style={{display: 'flex', alignItems: 'center', gap: 12}}><Progress percent={v} size="small" showInfo={false} strokeColor="#ef4444" style={{flex: 1}} /><Text strong style={{fontSize: 11}}>{v}%</Text></div> }
                                        ]} pagination={false} size="small" scroll={{y: 300}} />
                                    </div>
                                </div>
                            </Col>
                        </Row>
                    </div>

                    <Modal title="BÁO CÁO ĐIỀU HÀNH TỰ ĐỘNG" open={reportModal} onCancel={() => setReportModal(false)} width={800} footer={[<Button key="back" onClick={() => setReportModal(false)}>ĐÓNG</Button>, <Button key="submit" type="primary" onClick={() => {navigator.clipboard.writeText(reportContent); message.success("Đã sao chép!");}}>SAO CHÉP</Button>]}>
                        <div className="report-preview">{reportContent}</div>
                    </Modal>
                </Layout>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
