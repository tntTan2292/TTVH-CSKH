<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VNPOST HUE - EXECUTIVE COMMAND CENTER V2.5</title>
    <!-- LIBRARIES -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/recharts@2.10.3/umd/Recharts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/antd@5.12.2/dist/antd.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5.12.2/dist/reset.css">
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.5/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #003a8c; --primary-dark: #002766; --accent: #fadb14; --danger: #ef4444; 
            --bg: #f8fafc; --card-bg: #ffffff; --text-main: #1e293b;
            --text-sub: #64748b; --border: #e2e8f0;
        }
        body { margin: 0; font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text-main); }
        .header { background: #ffffff; padding: 12px 24px; border-bottom: 2px solid var(--primary); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .main-container { padding: 24px; max-width: 1920px; margin: 0 auto; }
        .executive-card { background: var(--card-bg); border-radius: 12px; padding: 0; border: 1px solid var(--border); height: 100%; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); overflow: hidden; }
        .card-inner { padding: 20px; }
        .kpi-value { font-size: 32px; font-weight: 700; color: var(--primary); line-height: 1.1; }
        .kpi-label { font-size: 10px; text-transform: uppercase; color: var(--text-sub); letter-spacing: 1px; margin-bottom: 6px; font-weight: 600; }
        
        .direction-card { background: #f1f5f9; border-radius: 8px; padding: 12px; border-left: 4px solid var(--primary); }
        
        .ant-table-thead > tr > th { 
            background: var(--primary-dark) !important; 
            color: #ffffff !important; 
            font-size: 10px !important; 
            font-weight: 600 !important; 
            text-transform: uppercase;
        }
        .ant-table-tbody > tr > td { padding: 10px 16px !important; font-size: 12px; }
        .section-header { display: flex; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--border); background: #fafafa; }
        .section-indicator { width: 4px; height: 18px; background: var(--primary); border-radius: 2px; margin-right: 12px; }
        .section-title { font-size: 12px; font-weight: 700; color: var(--text-main); text-transform: uppercase; margin: 0; }
        .nav-brand { font-size: 18px; font-weight: 800; color: var(--primary); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, Component } = React;
        const { Layout, Row, Col, Table, Tag, Progress, Button, message, Space, Typography, Badge, Modal, Result, Empty, Card, Statistic } = window.antd;
        const { Text, Title } = Typography;
        
        const getPerformanceColor = (rate) => {
            if (rate >= 90) return '#059669';
            if (rate >= 75) return '#003a8c';
            if (rate >= 60) return '#f59e0b';
            return '#ef4444';
        };

        const App = () => {
            const [data, setData] = useState(null);
            const [bcvhData, setBcvhData] = useState([]);
            const [slaRisk, setSlaRisk] = useState([]);
            const [provinceData, setProvinceData] = useState([]);
            const [loading, setLoading] = useState(true);
            const API_BASE = "http://localhost:8010";

            const fetchAll = async () => {
                setLoading(true);
                try {
                    const [s, b, r, p] = await Promise.all([
                        fetch(`${API_BASE}/api/dashboard/stats`).then(res => res.json()),
                        fetch(`${API_BASE}/api/dashboard/bcvh-summary`).then(res => res.json()),
                        fetch(`${API_BASE}/api/dashboard/sla-risk`).then(res => res.json()),
                        fetch(`${API_BASE}/api/dashboard/province-performance`).then(res => res.json())
                    ]);
                    setData(s && !s.error ? s : null);
                    setBcvhData(Array.isArray(b) ? b : []);
                    setSlaRisk(Array.isArray(r) ? r : []);
                    setProvinceData(Array.isArray(p) ? p : []);
                } catch (err) { message.error("API Error 8010"); } 
                finally { setLoading(false); }
            };

            useEffect(() => { fetchAll(); }, []);

            if (loading && !data) return <div style={{padding: 100, textAlign: 'center', background: '#f8fafc', height: '100vh'}}><Progress percent={100} status="active" showInfo={false} strokeColor="#003a8c" /><p style={{marginTop: 16, color: '#64748b'}}>Đang khởi động COMMAND CENTER...</p></div>;

            if (!data) return <div style={{padding: 100, textAlign: 'center'}}><Result status="info" title="Hệ thống Điều hành" extra={<Button type="primary" onClick={() => window.location.reload()}>LOAD DATA</Button>} /></div>;

            const nRate = data.directions.north.total > 0 ? Math.round(data.directions.north.success * 100 / data.directions.north.total) : 0;
            const sRate = data.directions.south.total > 0 ? Math.round(data.directions.south.success * 100 / data.directions.south.total) : 0;

            return (
                <Layout style={{minHeight: '100vh', background: '#f8fafc'}}>
                    <div className="header">
                        <div className="nav-brand">VNPOST HUẾ <span style={{color: '#f97316'}}>D.O.C</span></div>
                        <Space><Button type="primary" onClick={() => window.location.reload()} style={{background: '#003a8c'}}>IMPORT MỚI</Button> <Button icon={<span>🔄</span>} onClick={fetchAll} /></Space>
                    </div>

                    <div className="main-container">
                        <Row gutter={[20, 20]}>
                            {/* KPI SECTION */}
                            <Col span={6}><div className="executive-card" style={{borderTop: '4px solid #003a8c'}}><div className="card-inner"><div className="kpi-label">Tổng sản lượng VIP</div><div className="kpi-value">{(data.kpis.total).toLocaleString()}</div></div></div></Col>
                            <Col span={6}><div className="executive-card" style={{borderTop: '4px solid #059669'}}><div className="card-inner"><div className="kpi-label">Phát thành công</div><div className="kpi-value" style={{color: '#059669'}}>{(data.kpis.success).toLocaleString()}</div></div></div></Col>
                            <Col span={6}><div className="executive-card" style={{borderTop: '4px solid #f59e0b'}}><div className="card-inner"><div className="kpi-label">Tồn xử lý</div><div className="kpi-value" style={{color: '#f59e0b'}}>{(data.kpis.pending).toLocaleString()}</div></div></div></Col>
                            <Col span={6}><div className="executive-card" style={{borderTop: '4px solid #ef4444'}}><div className="card-inner"><div className="kpi-label">Vi phạm SLA</div><div className="kpi-value" style={{color: '#ef4444'}}>{(data.kpis.sla).toLocaleString()}</div></div></div></Col>

                            {/* DIRECTIONAL PANEL */}
                            <Col span={12}>
                                <div className="executive-card">
                                    <div className="section-header"><div className="section-indicator"></div><div className="section-title">Trục Điều hành Hướng Bắc</div></div>
                                    <div className="card-inner">
                                        <Row gutter={16}>
                                            <Col span={12}><Statistic title="Sản lượng" value={data.directions.north.total} /></Col>
                                            <Col span={12}><Statistic title="Tỷ lệ Thành công" value={nRate} suffix="%" valueStyle={{ color: getPerformanceColor(nRate) }} /></Col>
                                        </Row>
                                        <Progress percent={nRate} strokeColor={getPerformanceColor(nRate)} style={{marginTop: 12}} />
                                    </div>
                                </div>
                            </Col>
                            <Col span={12}>
                                <div className="executive-card">
                                    <div className="section-header"><div className="section-indicator" style={{background: '#f97316'}}></div><div className="section-title">Trục Điều hành Hướng Nam</div></div>
                                    <div className="card-inner">
                                        <Row gutter={16}>
                                            <Col span={12}><Statistic title="Sản lượng" value={data.directions.south.total} /></Col>
                                            <Col span={12}><Statistic title="Tỷ lệ Thành công" value={sRate} suffix="%" valueStyle={{ color: getPerformanceColor(sRate) }} /></Col>
                                        </Row>
                                        <Progress percent={sRate} strokeColor={getPerformanceColor(sRate)} style={{marginTop: 12}} />
                                    </div>
                                </div>
                            </Col>

                            <Col span={24}>
                                <div className="executive-card">
                                    <div className="section-header"><div className="section-indicator"></div><div className="section-title">Ma trận Hiệu suất Tỉnh phát (Bắc - Nam Matrix)</div></div>
                                    <div className="card-inner">
                                        <Table dataSource={provinceData} columns={[
                                            { title: 'HƯỚNG', dataIndex: 'direction', width: 100, render: v => <Tag color={v === 'Bắc' ? 'blue' : 'orange'}>{v}</Tag> },
                                            { title: 'TỈNH PHÁT', dataIndex: 'name', width: 180, render: t => <Text strong>{t}</Text> },
                                            { title: 'SẢN LƯỢNG', dataIndex: 'total', align: 'right', width: 120 },
                                            { title: 'TỶ LỆ THÀNH CÔNG', dataIndex: 'success_rate', width: 250, render: (v, r) => (
                                                <div style={{display: 'flex', alignItems: 'center', gap: 12}}>
                                                    <Progress percent={v} size="small" showInfo={false} strokeColor={getPerformanceColor(v)} style={{flex: 1}} />
                                                    <Text strong style={{fontSize: 11, width: 35, color: getPerformanceColor(v)}}>{v}%</Text>
                                                </div>
                                            )},
                                            { title: 'SLA RISK', dataIndex: 'sla', align: 'right', width: 100, render: v => <Text style={{color: v > 0 ? '#ef4444' : '#64748b', fontWeight: 600}}>{v}</Text> },
                                            { title: 'RỦI RO (%)', dataIndex: 'sla_rate', width: 200, render: v => (
                                                <div style={{display: 'flex', alignItems: 'center', gap: 12}}>
                                                    <Progress percent={v} size="small" showInfo={false} strokeColor="#ef4444" style={{flex: 1}} />
                                                    <Text strong style={{fontSize: 11, width: 35, color: v > 10 ? '#ef4444' : '#64748b'}}>{v}%</Text>
                                                </div>
                                            )}
                                        ]} pagination={false} size="small" scroll={{y: 400}} />
                                    </div>
                                </div>
                            </Col>

                            <Col span={14}>
                                <div className="executive-card">
                                    <div className="section-header"><div className="section-indicator"></div><div className="section-title">Hiệu suất Bưu cục Vận hành</div></div>
                                    <div className="card-inner">
                                        <Table dataSource={bcvhData} columns={[
                                            { title: 'BƯU CỤC', dataIndex: 'name', render: t => <Text strong>{t}</Text> },
                                            { title: 'TỈNH', dataIndex: 'province' },
                                            { title: 'SẢN LƯỢNG', dataIndex: 'total', align: 'right' },
                                            { title: 'TỶ LỆ', dataIndex: 'rate', align: 'center', render: v => <Tag color={getPerformanceColor(v)}>{v}%</Tag> }
                                        ]} pagination={{pageSize: 8}} size="small" />
                                    </div>
                                </div>
                            </Col>

                            <Col span={10}>
                                <div className="executive-card">
                                    <div className="section-header" style={{background: '#fff1f0'}}><div className="section-indicator" style={{background: '#ef4444'}}></div><div className="section-title" style={{color: '#cf1322'}}>Cảnh báo SLA (>3 ngày)</div></div>
                                    <div className="card-inner">
                                        <Table dataSource={slaRisk} columns={[
                                            { title: 'MÃ BƯU GỬI', dataIndex: 'tracking_id', render: t => <Text code>{t}</Text> },
                                            { title: 'BCVH', dataIndex: 'post_office_name' },
                                            { title: 'AGING', dataIndex: 'aging', render: v => <Tag color="error">{v}N</Tag> }
                                        ]} pagination={{pageSize: 8}} size="small" />
                                    </div>
                                </div>
                            </Col>
                        </Row>
                    </div>
                </Layout>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
