<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VNPOST HUE - EXECUTIVE COMMAND CENTER V2.3</title>
    <!-- LIBRARIES -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/recharts@2.10.3/umd/Recharts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/antd@5.12.2/dist/antd.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5.12.2/dist/reset.css">
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.5/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #003a8c; --primary-dark: #002766; --accent: #fadb14; --danger: #ef4444; 
            --bg: #f8fafc; --card-bg: #ffffff; --text-main: #1e293b;
            --text-sub: #64748b; --border: #e2e8f0;
            --color-best: #059669; --color-good: #003a8c; --color-mid: #f59e0b; --color-low: #ef4444;
        }
        body { margin: 0; font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text-main); }
        .header { background: #ffffff; padding: 12px 24px; border-bottom: 2px solid var(--primary); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .main-container { padding: 24px; max-width: 1920px; margin: 0 auto; }
        .executive-card { background: var(--card-bg); border-radius: 12px; padding: 0; border: 1px solid var(--border); height: 100%; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); overflow: hidden; }
        .card-inner { padding: 20px; }
        .kpi-value { font-size: 36px; font-weight: 700; color: var(--primary); line-height: 1.1; }
        .kpi-label { font-size: 11px; text-transform: uppercase; color: var(--text-sub); letter-spacing: 1px; margin-bottom: 8px; font-weight: 600; }
        
        /* PREMIUM TABLE STYLE */
        .ant-table-wrapper { border-radius: 8px; overflow: hidden; }
        .ant-table-thead > tr > th { 
            background: var(--primary-dark) !important; 
            color: #ffffff !important; 
            font-size: 11px !important; 
            font-weight: 600 !important; 
            text-transform: uppercase;
            padding: 14px 16px !important;
            border-bottom: none !important;
        }
        .ant-table-tbody > tr:hover > td { background: #f1f5f9 !important; }
        .ant-table-tbody > tr > td { padding: 12px 16px !important; border-bottom: 1px solid #f1f5f9 !important; }
        
        /* SECTION TITLE STYLE */
        .section-header { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); background: #fafafa; }
        .section-indicator { width: 4px; height: 18px; background: var(--primary); border-radius: 2px; margin-right: 12px; }
        .section-title { font-size: 13px; font-weight: 700; color: var(--text-main); text-transform: uppercase; margin: 0; letter-spacing: 0.5px; }

        .nav-brand { font-size: 18px; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }
        .nav-brand span { color: #f97316; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, Component } = React;
        const { Layout, Row, Col, Table, Tag, Progress, Button, message, Space, Typography, Badge, Modal, Result, Empty } = window.antd;
        const { Text, Title } = Typography;
        
        const getPerformanceColor = (rate) => {
            if (rate >= 90) return '#059669';
            if (rate >= 75) return '#003a8c';
            if (rate >= 60) return '#f59e0b';
            return '#ef4444';
        };

        const App = () => {
            const [stats, setStats] = useState(null);
            const [bcvhData, setBcvhData] = useState([]);
            const [slaRisk, setSlaRisk] = useState([]);
            const [provinceChartData, setProvinceChartData] = useState([]);
            const [loading, setLoading] = useState(true);
            const API_BASE = "http://localhost:8010/api/dashboard";

            const fetchAll = async () => {
                setLoading(true);
                try {
                    const [s, b, r, p] = await Promise.all([
                        fetch(`${API_BASE}/stats`).then(res => res.json()),
                        fetch(`${API_BASE}/bcvh-summary`).then(res => res.json()),
                        fetch(`${API_BASE}/sla-risk`).then(res => res.json()),
                        fetch(`${API_BASE}/province-performance`).then(res => res.json())
                    ]);
                    setStats(s && !s.error ? s : null);
                    setBcvhData(Array.isArray(b) ? b : []);
                    setSlaRisk(Array.isArray(r) ? r : []);
                    setProvinceChartData(Array.isArray(p) ? p : []);
                } catch (err) { message.error("API Error 8010"); } 
                finally { setLoading(false); }
            };

            useEffect(() => { fetchAll(); }, []);

            if (loading && !stats) return <div style={{padding: 100, textAlign: 'center', background: '#f8fafc', height: '100vh'}}><Progress percent={100} status="active" showInfo={false} strokeColor="#003a8c" /><p style={{marginTop: 16, color: '#64748b'}}>Đang khởi động COMMAND CENTER...</p></div>;

            if (!stats) return <div style={{padding: 100, textAlign: 'center'}}><Result status="info" title="Hệ thống Điều hành" extra={<Button type="primary" onClick={() => window.location.reload()}>LOAD DATA</Button>} /></div>;

            const { ResponsiveContainer, BarChart, Bar, XAxis, YAxis, Tooltip: ReTooltip, Cell } = window.Recharts || {};

            return (
                <Layout style={{minHeight: '100vh', background: '#f8fafc'}}>
                    <div className="header">
                        <div className="nav-brand">VNPOST HUẾ <span>D.O.C</span></div>
                        <Space>
                            <Button type="primary" onClick={() => window.location.reload()} style={{background: '#003a8c', fontWeight: 600}}>NHẬP DỮ LIỆU MỚI</Button>
                            <Button icon={<span>🔄</span>} onClick={fetchAll} />
                        </Space>
                    </div>

                    <div className="main-container">
                        <Row gutter={[24, 24]}>
                            {/* KPI SECTION */}
                            <Col span={6}><div className="executive-card" style={{borderTop: '4px solid #003a8c'}}><div className="card-inner"><div className="kpi-label">Tổng sản lượng VIP</div><div className="kpi-value">{(stats?.kpis?.total ?? 0).toLocaleString()}</div></div></div></Col>
                            <Col span={6}><div className="executive-card" style={{borderTop: '4px solid #059669'}}><div className="card-inner"><div className="kpi-label">Phát thành công</div><div className="kpi-value" style={{color: '#059669'}}>{(stats?.kpis?.success ?? 0).toLocaleString()}</div></div></div></Col>
                            <Col span={6}><div className="executive-card" style={{borderTop: '4px solid #f59e0b'}}><div className="card-inner"><div className="kpi-label">Đang tồn đọng</div><div className="kpi-value" style={{color: '#f59e0b'}}>{(stats?.kpis?.pending ?? 0).toLocaleString()}</div></div></div></Col>
                            <Col span={6}><div className="executive-card" style={{borderTop: '4px solid #ef4444'}}><div className="card-inner"><div className="kpi-label">Cảnh báo SLA</div><div className="kpi-value" style={{color: '#ef4444'}}>{(stats?.kpis?.sla ?? 0).toLocaleString()}</div></div></div></Col>

                            <Col span={14}>
                                <div className="executive-card">
                                    <div className="section-header"><div className="section-indicator"></div><div className="section-title">Phân tích hiệu suất theo Bưu cục</div></div>
                                    <div className="card-inner">
                                        <Table dataSource={bcvhData} columns={[
                                            { title: 'BƯU CỤC VẬN HÀNH', dataIndex: 'name', render: (t, r) => (
                                                <Space>
                                                    <div style={{width: 3, height: 12, background: getPerformanceColor(provinceChartData.find(p => p.name === r.province)?.rate || 0)}} />
                                                    <Text strong>{t}</Text>
                                                </Space>
                                            )},
                                            { title: 'TỔNG ĐƠN', dataIndex: 'total', align: 'right' },
                                            { title: 'THÀNH CÔNG', dataIndex: 'success', align: 'right', render: v => <Text style={{color: '#059669', fontWeight: 600}}>{v}</Text> },
                                            { title: 'TỶ LỆ (%)', dataIndex: 'rate', align: 'center', render: v => <Tag color={getPerformanceColor(v)}>{v}%</Tag> }
                                        ]} pagination={{pageSize: 8}} size="small" />
                                    </div>
                                </div>
                            </Col>

                            <Col span={10}>
                                <div className="executive-card">
                                    <div className="section-header"><div className="section-indicator"></div><div className="section-title">Xếp hạng hiệu suất Tỉnh phát</div></div>
                                    <div className="card-inner">
                                        <div style={{height: 330}}>
                                            {ResponsiveContainer && provinceChartData.length > 0 ? (
                                                <ResponsiveContainer width="100%" height="100%">
                                                    <BarChart data={provinceChartData} layout="vertical" margin={{ left: 80, right: 30 }}>
                                                        <XAxis type="number" hide />
                                                        <YAxis dataKey="name" type="category" tick={{fill: '#64748b', fontSize: 10}} width={120} />
                                                        <ReTooltip cursor={{fill: '#f1f5f9'}} contentStyle={{borderRadius: 8, border: 'none', boxShadow: '0 4px 6px -1px rgba(0,0,0,0.1)'}} />
                                                        <Bar dataKey="rate" radius={[0, 4, 4, 0]} isAnimationActive={false}>
                                                            {provinceChartData.map((e, i) => <Cell key={i} fill={getPerformanceColor(e.rate)} />)}
                                                        </Bar>
                                                    </BarChart>
                                                </ResponsiveContainer>
                                            ) : <div style={{padding: 50, textAlign: 'center'}}><Empty description="Chưa có dữ liệu" /></div>}
                                        </div>
                                    </div>
                                </div>
                            </Col>

                            <Col span={24}>
                                <div className="executive-card">
                                    <div className="section-header" style={{background: '#fff1f0'}}><div className="section-indicator" style={{background: '#ef4444'}}></div><div className="section-title" style={{color: '#cf1322'}}>Action Center: Danh sách đơn hàng rủi ro cao (SLA Violation)</div></div>
                                    <div className="card-inner">
                                        <Table dataSource={slaRisk} columns={[
                                            { title: 'MÃ BƯU GỬI', dataIndex: 'tracking_id', render: t => <Text strong style={{color: '#003a8c'}}>{t}</Text> },
                                            { title: 'TỈNH PHÁT', dataIndex: 'province' },
                                            { title: 'BƯU CỤC VẬN HÀNH', dataIndex: 'post_office_name' },
                                            { title: 'THỜI GIAN TỒN', dataIndex: 'aging', render: v => <Tag color="error" style={{fontWeight: 700}}>{v} NGÀY</Tag> },
                                            { title: 'THAO TÁC', render: () => <Button size="small" type="link">Xử lý ngay</Button> }
                                        ]} pagination={{pageSize: 5}} size="small" />
                                    </div>
                                </div>
                            </Col>
                        </Row>
                    </div>
                </Layout>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
