<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VNPOST HUE - EXECUTIVE COMMAND CENTER</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/antd@5.12.2/dist/antd.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5.12.2/dist/reset.css">
    <script src="https://cdn.jsdelivr.net/npm/recharts@2.10.3/umd/Recharts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.5/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #001529; --accent: #fadb14; --danger: #ff4d4f; --bg: #000c17; --card-bg: #001529; --text: #ffffff; }
        body { margin: 0; font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
        .header { background: var(--primary); padding: 12px 24px; border-bottom: 2px solid var(--accent); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .main-container { padding: 16px; max-width: 1920px; margin: 0 auto; }
        .executive-card { background: var(--card-bg); border-radius: 8px; padding: 16px; border: 1px solid rgba(255,255,255,0.1); height: 100%; min-height: 100px; }
        .kpi-value { font-size: 32px; font-weight: 700; color: var(--accent); line-height: 1.2; }
        .kpi-label { font-size: 11px; text-transform: uppercase; color: rgba(255,255,255,0.5); letter-spacing: 1px; margin-bottom: 8px; }
        .ant-table { background: transparent !important; color: white !important; }
        .ant-table-thead > tr > th { background: rgba(255,255,255,0.05) !important; color: rgba(255,255,255,0.6) !important; border-bottom: 1px solid rgba(255,255,255,0.1) !important; font-size: 11px; }
        .ant-table-tbody > tr > td { border-bottom: 1px solid rgba(255,255,255,0.05) !important; font-size: 12px; }
        .ant-table-cell { color: white !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, Component } = React;
        const { Layout, Row, Col, Table, Tag, Progress, Button, message, Space, Typography, Badge, Modal, Result, Empty } = window.antd;
        const { Text, Title } = Typography;
        const { ResponsiveContainer, RadarChart, PolarGrid, PolarAngleAxis, Radar, Tooltip: ReTooltip } = window.Recharts || {};
        const API_BASE = "http://localhost:8010/api/dashboard";

        class ErrorBoundary extends Component {
            constructor(props) { super(props); this.state = { hasError: false }; }
            static getDerivedStateFromError(error) { return { hasError: true }; }
            render() {
                if (this.state.hasError) return <div style={{padding: 20, color: '#ff4d4f', border: '1px solid #ff4d4f', borderRadius: 8}}>⚠️ Widget Crash - Vui lòng F5</div>;
                return this.props.children;
            }
        }

        const App = () => {
            const [stats, setStats] = useState(null);
            const [bcvhData, setBcvhData] = useState([]);
            const [bottlenecks, setBottlenecks] = useState([]);
            const [slaRisk, setSlaRisk] = useState([]);
            const [radarChartData, setRadarChartData] = useState([]);
            const [loading, setLoading] = useState(true);

            const fetchAll = async () => {
                setLoading(true);
                try {
                    const [s, b, n, r, radar] = await Promise.all([
                        fetch(`${API_BASE}/stats`).then(res => res.json()),
                        fetch(`${API_BASE}/bcvh-summary`).then(res => res.json()),
                        fetch(`${API_BASE}/bcvh-bottleneck`).then(res => res.json()),
                        fetch(`${API_BASE}/sla-risk`).then(res => res.json()),
                        fetch(`${API_BASE}/radar`).then(res => res.json())
                    ]);
                    
                    setStats(s && !s.error ? s : null);
                    setBcvhData(Array.isArray(b) ? b : []);
                    setBottlenecks(Array.isArray(n) ? n : []);
                    setSlaRisk(Array.isArray(r) ? r : []);

                    // BẮT BUỘC: Radar Adapter & Console Logging
                    console.log("RADAR_RAW_API_RESPONSE:", radar);
                    if (radar && radar.labels && radar.datasets?.[0]?.data) {
                        const transformed = radar.labels.map((label, idx) => ({
                            subject: label,
                            A: radar.datasets[0].data[idx]
                        }));
                        console.log("RADAR_TRANSFORMED_FOR_RECHARTS:", transformed);
                        setRadarChartData(transformed);
                    } else {
                        setRadarChartData([]);
                    }

                } catch (err) { 
                    console.error("Connectivity Failure:", err);
                    message.error("Mất kết nối Enterprise Backend 8010"); 
                } finally { setLoading(false); }
            };

            useEffect(() => { fetchAll(); }, []);

            const handleUpload = async () => {
                const input = document.createElement('input');
                input.type = 'file'; input.accept = '.xlsx';
                input.onchange = async (e) => {
                    const formData = new FormData(); formData.append('file', e.target.files[0]);
                    const hide = message.loading('Đang khởi tạo Snapshot...', 0);
                    try {
                        const res = await fetch(`http://localhost:8010/upload`, { method: 'POST', body: formData });
                        if (res.ok) { message.success("Snapshot Created!"); fetchAll(); }
                        else { const j = await res.json(); Modal.error({ title: 'Import Error', content: j.detail }); }
                    } catch (err) { message.error("Upload Failed"); }
                    finally { hide(); }
                };
                input.click();
            };

            if (loading && !stats) return <div style={{padding: 100, textAlign: 'center', background: '#000c17', height: '100vh'}}><Progress percent={100} status="active" showInfo={false} strokeColor="#fadb14" /><p style={{color: 'white', marginTop: 16}}>Đang thẩm định Operational Layer...</p></div>;

            if (!stats) return (
                <Layout style={{minHeight: '100vh', background: 'var(--bg)'}}>
                    <div className="header"><Title level={4} style={{color: 'white', margin: 0}}>VNPOST HUE DOC</Title></div>
                    <div style={{padding: 100, textAlign: 'center'}}><Result status="info" title={<span style={{color: 'white'}}>Executive System Ready</span>} subTitle={<span style={{color: 'rgba(255,255,255,0.5)'}}>Chưa ghi nhận Snapshot. Vui lòng nạp dữ liệu Logistics.</span>} extra={<Button type="primary" size="large" onClick={handleUpload} style={{background: 'var(--accent)', color: 'black', border: 'none'}}>BẮT ĐẦU IMPORT</Button>} /></div>
                </Layout>
            );

            return (
                <ErrorBoundary>
                <Layout style={{minHeight: '100vh', background: 'var(--bg)'}}>
                    <div className="header">
                        <Space size="large">
                            <Title level={4} style={{color: 'white', margin: 0, letterSpacing: 1}}>VNPOST HUE <span style={{color: 'var(--accent)', fontSize: 12}}>DOC</span></Title>
                            <Tag color="gold" style={{background: 'transparent', border: '1px solid var(--accent)', color: 'var(--accent)'}}>SNAPSHOT V{stats?.session_info?.id ?? '0'}</Tag>
                        </Space>
                        <Space>
                            <Button type="primary" onClick={handleUpload} style={{background: 'var(--accent)', color: 'black', fontWeight: 600, border: 'none'}}>IMPORT DATA</Button>
                            <Button icon={<span>🔄</span>} onClick={fetchAll} ghost />
                        </Space>
                    </div>

                    <div className="main-container">
                        <Row gutter={[16, 16]}>
                            <Col span={6}><div className="executive-card"><div className="kpi-label">Tổng sản lượng</div><div className="kpi-value">{(stats?.kpis?.total ?? 0).toLocaleString()}</div></div></Col>
                            <Col span={6}><div className="executive-card"><div className="kpi-label">Phát thành công</div><div className="kpi-value" style={{color: '#52c41a'}}>{(stats?.kpis?.success ?? 0).toLocaleString()}</div><Progress percent={Math.round((stats?.kpis?.success ?? 0)*100/(stats?.kpis?.total ?? 1))} size="small" strokeColor="#52c41a" trailColor="rgba(255,255,255,0.1)" /></div></Col>
                            <Col span={6}><div className="executive-card"><div className="kpi-label">Tồn đang xử lý</div><div className="kpi-value" style={{color: '#faad14'}}>{(stats?.kpis?.pending ?? 0).toLocaleString()}</div></div></Col>
                            <Col span={6}><div className="executive-card" style={{borderColor: 'var(--danger)'}}><div className="kpi-label">Vi phạm SLA</div><div className="kpi-value" style={{color: 'var(--danger)'}}>{(stats?.kpis?.sla ?? 0).toLocaleString()}</div></div></Col>

                            <Col span={12}>
                                <div className="executive-card">
                                    <Title level={5} style={{color: 'white', marginBottom: 16}}>📊 Hiệu suất Bưu cục Vận hành (BCVH)</Title>
                                    <Table dataSource={bcvhData || []} columns={[
                                        { title: 'BƯU CỤC', dataIndex: 'name', key: 'name' },
                                        { title: 'TỔNG', dataIndex: 'total', key: 'total', align: 'right' },
                                        { title: 'THÀNH CÔNG', dataIndex: 'success', key: 'success', align: 'right', render: (v) => <span style={{color: '#b7eb8f'}}>{v}</span> },
                                        { title: 'SLA', dataIndex: 'sla', key: 'sla', align: 'right', render: (v) => <span style={{color: v > 0 ? 'var(--danger)' : 'inherit'}}>{v}</span> },
                                        { title: 'TỶ LỆ (%)', dataIndex: 'rate', key: 'rate', align: 'center', render: (v) => <Tag color={v > 90 ? 'green' : 'orange'}>{v}%</Tag> }
                                    ]} pagination={{pageSize: 8}} size="small" />
                                </div>
                            </Col>

                            <Col span={6}>
                                <div className="executive-card">
                                    <Title level={5} style={{color: 'white', marginBottom: 16}}>🎯 Radar Snapshot</Title>
                                    <div style={{height: 300}}>
                                        {ResponsiveContainer && radarChartData.length > 0 ? (
                                            <ResponsiveContainer width="100%" height="100%">
                                                <RadarChart cx="50%" cy="50%" outerRadius="70%" data={radarChartData}>
                                                    <PolarGrid stroke="rgba(255,255,255,0.1)" />
                                                    <PolarAngleAxis dataKey="subject" tick={{fontSize: 9, fill: 'rgba(255,255,255,0.5)'}} />
                                                    <Radar name="Hiệu suất" dataKey="A" stroke="var(--accent)" fill="var(--accent)" fillOpacity={0.5} />
                                                    <ReTooltip contentStyle={{background: '#001529', border: '1px solid var(--accent)', color: 'white'}} />
                                                </RadarChart>
                                            </ResponsiveContainer>
                                        ) : <Empty description="Radar Data Missing" style={{marginTop: 50}} />}
                                    </div>
                                </div>
                            </Col>

                            <Col span={6}>
                                <div className="executive-card">
                                    <Title level={5} style={{color: 'white', marginBottom: 16}}>⚠️ Điểm nghẽn tồn đọng</Title>
                                    <Table dataSource={bottlenecks || []} columns={[
                                        { title: 'BƯU CỤC', dataIndex: 'name', key: 'name' },
                                        { title: 'TỒN', dataIndex: 'backlog', key: 'backlog', align: 'right', render: (v) => <span style={{color: 'var(--accent)', fontWeight: 700}}>{v}</span> },
                                        { title: 'MAX AGING', dataIndex: 'max_aging', key: 'max_aging', align: 'right', render: (v) => <span>{v}d</span> }
                                    ]} pagination={false} size="small" />
                                </div>
                            </Col>

                            <Col span={24}>
                                <div className="executive-card">
                                    <Title level={5} style={{color: 'white', marginBottom: 16}}>🛡️ Action Center (SLA Risk Management)</Title>
                                    <Table dataSource={slaRisk || []} columns={[
                                        { title: 'MÃ BƯU GỬI', dataIndex: 'tracking_id', key: 'tracking_id' },
                                        { title: 'TỈNH PHÁT', dataIndex: 'province', key: 'province' },
                                        { title: 'BƯU CỤC VẬN HÀNH', dataIndex: 'post_office_name', key: 'post_office_name' },
                                        { title: 'TUỔI ĐƠN', dataIndex: 'aging', key: 'aging', render: (v) => <Tag color="error">{v} NGÀY</Tag> },
                                        { title: 'HÀNH ĐỘNG', key: 'action', render: () => <Button size="small" ghost type="primary">Xử lý ngay</Button> }
                                    ]} pagination={{pageSize: 5}} size="small" />
                                </div>
                            </Col>
                        </Row>
                    </div>
                </Layout>
                </ErrorBoundary>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
