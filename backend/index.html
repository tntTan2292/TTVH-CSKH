<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VNPOST HUE - EXECUTIVE COMMAND CENTER V2.4</title>
    <!-- LIBRARIES -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/recharts@2.10.3/umd/Recharts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/antd@5.12.2/dist/antd.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5.12.2/dist/reset.css">
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.5/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #003a8c; --primary-dark: #002766; --accent: #fadb14; --danger: #ef4444; 
            --bg: #f8fafc; --card-bg: #ffffff; --text-main: #1e293b;
            --text-sub: #64748b; --border: #e2e8f0;
            --color-best: #059669; --color-good: #003a8c; --color-mid: #f59e0b; --color-low: #ef4444;
        }
        body { margin: 0; font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text-main); }
        .header { background: #ffffff; padding: 12px 24px; border-bottom: 2px solid var(--primary); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .main-container { padding: 24px; max-width: 1920px; margin: 0 auto; }
        .executive-card { background: var(--card-bg); border-radius: 12px; padding: 0; border: 1px solid var(--border); height: 100%; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); overflow: hidden; }
        .card-inner { padding: 20px; }
        .kpi-value { font-size: 34px; font-weight: 700; color: var(--primary); line-height: 1.1; }
        .kpi-label { font-size: 11px; text-transform: uppercase; color: var(--text-sub); letter-spacing: 1px; margin-bottom: 8px; font-weight: 600; }
        .ant-table-thead > tr > th { 
            background: var(--primary-dark) !important; 
            color: #ffffff !important; 
            font-size: 10px !important; 
            font-weight: 600 !important; 
            text-transform: uppercase;
            padding: 12px 16px !important;
        }
        .ant-table-tbody > tr > td { padding: 10px 16px !important; font-size: 12px; }
        .section-header { display: flex; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--border); background: #fafafa; }
        .section-indicator { width: 4px; height: 18px; background: var(--primary); border-radius: 2px; margin-right: 12px; }
        .section-title { font-size: 12px; font-weight: 700; color: var(--text-main); text-transform: uppercase; margin: 0; }
        .nav-brand { font-size: 18px; font-weight: 800; color: var(--primary); }
        .nav-brand span { color: #f97316; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, Component } = React;
        const { Layout, Row, Col, Table, Tag, Progress, Button, message, Space, Typography, Badge, Modal, Result, Empty } = window.antd;
        const { Text, Title } = Typography;
        
        const getPerformanceColor = (rate) => {
            if (rate >= 90) return '#059669';
            if (rate >= 75) return '#003a8c';
            if (rate >= 60) return '#f59e0b';
            return '#ef4444';
        };

        const App = () => {
            const [stats, setStats] = useState(null);
            const [bcvhData, setBcvhData] = useState([]);
            const [slaRisk, setSlaRisk] = useState([]);
            const [provinceData, setProvinceData] = useState([]);
            const [loading, setLoading] = useState(true);
            const API_BASE = "http://localhost:8010";

            const fetchAll = async () => {
                setLoading(true);
                try {
                    const [s, b, r, p] = await Promise.all([
                        fetch(`${API_BASE}/api/dashboard/stats`).then(res => res.json()),
                        fetch(`${API_BASE}/api/dashboard/bcvh-summary`).then(res => res.json()),
                        fetch(`${API_BASE}/api/dashboard/sla-risk`).then(res => res.json()),
                        fetch(`${API_BASE}/api/dashboard/province-performance`).then(res => res.json())
                    ]);
                    setStats(s && !s.error ? s : null);
                    setBcvhData(Array.isArray(b) ? b : []);
                    setSlaRisk(Array.isArray(r) ? r : []);
                    setProvinceData(Array.isArray(p) ? p : []);
                } catch (err) { message.error("API Error 8010"); } 
                finally { setLoading(false); }
            };

            useEffect(() => { fetchAll(); }, []);

            if (loading && !stats) return <div style={{padding: 100, textAlign: 'center', background: '#f8fafc', height: '100vh'}}><Progress percent={100} status="active" showInfo={false} strokeColor="#003a8c" /><p style={{marginTop: 16, color: '#64748b'}}>Đang khởi động COMMAND CENTER...</p></div>;

            if (!stats) return <div style={{padding: 100, textAlign: 'center'}}><Result status="info" title="Hệ thống Điều hành V2.4" extra={<Button type="primary" onClick={() => window.location.reload()}>LOAD DATA</Button>} /></div>;

            return (
                <Layout style={{minHeight: '100vh', background: '#f8fafc'}}>
                    <div className="header">
                        <div className="nav-brand">VNPOST HUẾ <span>D.O.C</span></div>
                        <Space><Button icon={<span>🔄</span>} onClick={fetchAll} /> <Button type="primary" onClick={() => window.location.reload()} style={{background: '#003a8c'}}>IMPORT MỚI</Button></Space>
                    </div>

                    <div className="main-container">
                        <Row gutter={[24, 24]}>
                            {/* KPI SECTION */}
                            <Col span={6}><div className="executive-card" style={{borderTop: '4px solid #003a8c'}}><div className="card-inner"><div className="kpi-label">Tổng sản lượng VIP</div><div className="kpi-value">{(stats?.kpis?.total ?? 0).toLocaleString()}</div></div></div></Col>
                            <Col span={6}><div className="executive-card" style={{borderTop: '4px solid #059669'}}><div className="card-inner"><div className="kpi-label">Phát thành công</div><div className="kpi-value" style={{color: '#059669'}}>{(stats?.kpis?.success ?? 0).toLocaleString()}</div></div></div></Col>
                            <Col span={6}><div className="executive-card" style={{borderTop: '4px solid #f59e0b'}}><div className="card-inner"><div className="kpi-label">Đang tồn đọng</div><div className="kpi-value" style={{color: '#f59e0b'}}>{(stats?.kpis?.pending ?? 0).toLocaleString()}</div></div></div></Col>
                            <Col span={6}><div className="executive-card" style={{borderTop: '4px solid #ef4444'}}><div className="card-inner"><div className="kpi-label">Vi phạm SLA (>3 ngày)</div><div className="kpi-value" style={{color: '#ef4444'}}>{(stats?.kpis?.sla ?? 0).toLocaleString()}</div></div></div></Col>

                            <Col span={24}>
                                <div className="executive-card">
                                    <div className="section-header"><div className="section-indicator"></div><div className="section-title">Ma trận Hiệu suất Tỉnh phát (Multi-Metric Analysis)</div></div>
                                    <div className="card-inner">
                                        <Table dataSource={provinceData} columns={[
                                            { title: 'TỈNH PHÁT', dataIndex: 'name', render: t => <Text strong style={{color: '#003a8c'}}>{t}</Text> },
                                            { title: 'SỐ BƯU GỬI PHÁT', dataIndex: 'total', align: 'right', render: v => <Text strong>{v.toLocaleString()}</Text> },
                                            { title: 'TỶ LỆ THÀNH CÔNG', dataIndex: 'success_rate', render: (v, r) => (
                                                <div style={{width: 180}}>
                                                    <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: 4}}>
                                                        <Text size="small" style={{fontSize: 10}}>{r.success} đơn</Text>
                                                        <Text strong style={{fontSize: 10, color: getPerformanceColor(v)}}>{v}%</Text>
                                                    </div>
                                                    <Progress percent={v} size="small" showInfo={false} strokeColor={getPerformanceColor(v)} />
                                                </div>
                                            )},
                                            { title: 'VI PHẠM SLA', dataIndex: 'sla', align: 'right', render: v => <Text style={{color: v > 0 ? '#ef4444' : '#64748b', fontWeight: 600}}>{v}</Text> },
                                            { title: 'TỶ LỆ QUÁ SLA', dataIndex: 'sla_rate', render: v => (
                                                <div style={{width: 180}}>
                                                    <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: 4}}>
                                                        <Text strong style={{fontSize: 10, color: v > 10 ? '#ef4444' : '#64748b'}}>{v}% Risk</Text>
                                                    </div>
                                                    <Progress percent={v} size="small" showInfo={false} strokeColor="#ef4444" status={v > 10 ? 'exception' : 'normal'} />
                                                </div>
                                            )}
                                        ]} pagination={false} size="small" />
                                    </div>
                                </div>
                            </Col>

                            <Col span={14}>
                                <div className="executive-card">
                                    <div className="section-header"><div className="section-indicator"></div><div className="section-title">Phân tích hiệu suất theo Bưu cục</div></div>
                                    <div className="card-inner">
                                        <Table dataSource={bcvhData} columns={[
                                            { title: 'BƯU CỤC VẬN HÀNH', dataIndex: 'name', render: t => <Text strong>{t}</Text> },
                                            { title: 'TỈNH PHÁT', dataIndex: 'province', render: v => <Tag style={{fontSize: 10}}>{v}</Tag> },
                                            { title: 'SẢN LƯỢNG', dataIndex: 'total', align: 'right' },
                                            { title: 'TỶ LỆ (%)', dataIndex: 'rate', align: 'center', render: v => <Tag color={getPerformanceColor(v)}>{v}%</Tag> }
                                        ]} pagination={{pageSize: 8}} size="small" />
                                    </div>
                                </div>
                            </Col>

                            <Col span={10}>
                                <div className="executive-card">
                                    <div className="section-header" style={{background: '#fff1f0'}}><div className="section-indicator" style={{background: '#ef4444'}}></div><div className="section-title" style={{color: '#cf1322'}}>Danh sách rủi ro cao (SLA >3 ngày)</div></div>
                                    <div className="card-inner">
                                        <Table dataSource={slaRisk} columns={[
                                            { title: 'MÃ BƯU GỬI', dataIndex: 'tracking_id', render: t => <Text strong style={{color: '#003a8c'}}>{t}</Text> },
                                            { title: 'BƯU CỤC', dataIndex: 'post_office_name' },
                                            { title: 'TUỔI ĐƠN', dataIndex: 'aging', render: v => <Tag color="error" style={{fontWeight: 700}}>{v} NGÀY</Tag> }
                                        ]} pagination={{pageSize: 8}} size="small" />
                                    </div>
                                </div>
                            </Col>
                        </Row>
                    </div>
                </Layout>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
